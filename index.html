<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta Virtual de Premios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">
    <h1>¡Gira la Ruleta!</h1>
    <p>Ingresa tu usuario de Instagram para participar por un premio exclusivo.</p>

    <form id="form-ruleta">
      <input type="text" id="nombre" placeholder="Tu usuario (ej: @mozuri.nails)" required>
      <button type="submit" id="btn-girar">Girar Ruleta</button>
    </form>

    <div class="wheel-container">
      <div class="flecha"></div>
      <canvas id="canvas" width="500" height="500"></canvas>
    </div>

    <div id="resultado" class="hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
